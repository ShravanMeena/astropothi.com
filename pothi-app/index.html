<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FCFBF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100E0C" media="(prefers-color-scheme: dark)" />

    <!--
      This is the shell. Every tag the crawler actually reads is written per
      route by src/components/Seo.tsx and frozen into static HTML by
      scripts/prerender.js — the values below are only what a browser sees for
      the fraction of a second before React mounts, plus the fallback for the
      private routes that are deliberately never prerendered.

      So: no canonical and no og: tags here. A canonical in the shell would be
      inherited by every unprerendered URL and point them all at the homepage.
    -->
    <title>astropothi — Vedic astrology reports computed from your birth chart</title>
    <meta name="description" content="Personalised Vedic astrology reports computed from an astronomical ephemeris using your exact birth time, written out in full in English or Hindi." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#a9862e" />

    <!-- The API is on this same origin, so the first data fetch does not need a
         second connection — but the fonts do, and they block first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Meta Pixel. Base code fires PageView once on load; every other Meta
         event is mapped from the site's own track() calls in src/lib/track.ts,
         so there is one source of truth and nothing is double-counted. -->
    <script>!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','2528033734383374');fbq('track','PageView');</script>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2528033734383374&ev=PageView&noscript=1" alt=""/></noscript>
    <div id="root"></div><script type="module" src="/src/main.tsx"></script>
  </body>
</html>
