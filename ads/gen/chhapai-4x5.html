<!doctype html><html lang="hi"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ad.css"><style>
  .ad{width:1080px;height:1350px;padding:76px 76px;justify-content:space-between}
  .brand .en{font-size:34px} .brand .hi{font-size:21px}
  .eyebrow{font-size:20px;padding:10px 20px;margin-top:26px}
  h1{font-size:92px;margin-top:24px}
  .sub{font-size:26px;margin-top:18px}
  .covers{gap:24px;margin:20px 0}
  /* A stat block costs ~110px of vertical room, so the artwork gives it back —
     otherwise the CTA and the required disclaimer fall off the canvas. */
  .covers img{height:500px}
  .covers img.side{height:1px}
  .statline{margin-top:16px}
  .statline b{display:block;font-family:Fraunces,serif;color:#E8CE92;font-size:58px;line-height:1}
  .statline span{display:block;color:#A79E8C;font-size:20px;margin-top:8px}
  .row{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
  .cta{font-size:26px;padding:19px 32px}
  .code{font-size:21px;padding:19px 24px}
  .foot{font-size:15px;margin-top:18px}</style></head><body>
<div class="ad">
  <div>
    <div class="brand"><span class="en">Pothi</span><span class="hi">पोथी</span></div>
    <span class="eyebrow"><span class="dot"></span>तीन अलग डिज़ाइन</span>
    <h1>छपाई ऐसी,<br><em>जैसी आपकी विद्या।</em></h1>
    <p class="sub">पारंपरिक · आधुनिक · राजसी</p>
  </div>
  <div class="covers">
      <img class="" src="../assets/classic.png" alt="">
      <img class="" src="../assets/heritage.png" alt="">
  </div>
  <div>
    
    <div class="row">
      <span class="cta">WhatsApp पर बात करें →</span>
      <span class="code">POTHI10</span>
    </div>
    <p class="foot">दाम आप तय करें — हमारा कोई हिस्सा नहीं। रिपोर्ट मार्गदर्शन हेतु हैं; चिकित्सा, कानूनी या वित्तीय सलाह का विकल्प नहीं।</p>
  </div>
</div></body></html>
